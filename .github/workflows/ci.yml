name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_BACKEND: sqlite
      SQLITE_PATH: /tmp/commchatbot-ci.db
      JWT_SECRET_KEY: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check app tests --select F,E9
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e

  full-stack:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      DATABASE_BACKEND: sqlite
      SQLITE_PATH: /tmp/commchatbot-live-ci.db
      DATA_DIR: /tmp/commchatbot-live-data
      UPLOAD_DIR: /tmp/commchatbot-live-data/uploads
      KNOWLEDGE_INDEX_PATH: /tmp/commchatbot-live-data/knowledge.json
      CODING_WORKSPACE_DIR: /tmp/commchatbot-live-data/workspaces
      JWT_SECRET_KEY: ci-only-secret-at-least-32-characters
      ALLOW_ANONYMOUS: "false"
      OBSERVABILITY_ENABLED: "false"
      MEMORY_SEMANTIC_RECALL: "false"
      AGENT_WORKER_MODE: external
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start API
        run: |
          cd backend
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8765 > /tmp/commchatbot-api.log 2>&1 &
      - name: Wait for API
        run: |
          python - <<'PY'
          import time, urllib.request
          for _ in range(60):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8765/health", timeout=1) as response:
                      if response.status == 200:
                          raise SystemExit(0)
              except Exception:
                  time.sleep(0.5)
          raise SystemExit("API did not become ready")
          PY
      - name: Live browser E2E
        run: npm run test:e2e:live
        working-directory: frontend
      - name: Health endpoint performance gate
        run: python backend/scripts/load_test.py --requests 300 --concurrency 30 --max-failures 0 --min-rps 20 --max-p95-ms 1000
      - name: Print API log on failure
        if: failure()
        run: cat /tmp/commchatbot-api.log
